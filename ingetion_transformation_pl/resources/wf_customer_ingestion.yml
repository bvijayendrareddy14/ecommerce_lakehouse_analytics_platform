resources:
  jobs:
    customers_ingestion_pipeline:

      name: "wf_customer_ingestion"

      max_concurrent_runs: 1

      tasks:

        - task_key: customers_raw_ingest
          environment_key: default

          notebook_task:
            notebook_path: ../src/customers_raw.ipynb
            source: WORKSPACE

            base_parameters:
              catalog: ${var.raw_catalog}
              schema: ${var.raw_schema}
              env: ${var.env}

        - task_key: customers_stage_ingest
          environment_key: default

          depends_on:
            - task_key: customers_raw_ingest

          notebook_task:
            notebook_path: ../src/customers_stage.ipynb
            source: WORKSPACE

            base_parameters:
              catalog: ${var.stage_catalog}
              schema: ${var.stage_schema}
              env: ${var.env}

      queue:
        enabled: true

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      performance_target: PERFORMANCE_OPTIMIZED

      tags:
        project: ecommerce_lakehouse
        entity: customers
        env: ${var.env}