# A sample job for ingetion_transformation_pl.

resources:
  jobs:
    sample_job:
      name: ingestion_1

      trigger:
        # Run this job every day, exactly one day from the last run; see https://docs.databricks.com/api/workspace/jobs/create#trigger
        periodic:
          interval: 1
          unit: DAYS

      #email_notifications:
      #  on_failure:
      #    - your_email@example.com

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: env
          default: ${var.env}

      tasks:
        - task_key: customers_raw_ingest
          notebook_task:
            notebook_path: ../src/customers_raw.ipynb

        - task_key: customers_stage_ingest
          depends_on:
            - task_key: customers_raw_ingest
          notebook_task:
            notebook_path: ../src/customers_stage.ipynb

             

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
