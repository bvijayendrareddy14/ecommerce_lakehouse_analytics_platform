resources:
  jobs:
    returns_ingestion_pipeline:
      name: "wf_returns_ingestion"

      max_concurrent_runs: 1

      tasks:
        - task_key: returns_raw_ingest
          environment_key: default

          notebook_task:
            notebook_path: ../src/returns_raw.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.raw_catalog}
              schema: ${var.raw_schema}
              env: ${var.env}

        - task_key: returns_stage_ingest
          environment_key: default

          depends_on:
            - task_key: returns_raw_ingest

          notebook_task:
            notebook_path: ../src/returns_stage.ipynb
            source: WORKSPACE
            base_parameters:
              catalog: ${var.stage_catalog}
              schema: ${var.stage_schema}
              env: ${var.env}

      queue:
        enabled: true

      environments:
        - environment_key: default
          spec:
            environment_version: "4"

      performance_target: PERFORMANCE_OPTIMIZED

      tags:
        project: ecommerce_lakehouse
        entity: returns
        env: ${var.env}